<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Decorative inner circle glow -->
  <circle cx="256" cy="256" r="180" fill="#ffffff" fill-opacity="0.08"/>
  <!-- Lightning bolt / Service Rapide icon -->
  <path d="M280 80 L140 280 L250 280 L232 432 L372 232 L262 232 Z" 
        fill="#ffffff" 
        filter="url(#shadow)"
        stroke="#ffffff" 
        stroke-width="12" 
        stroke-linejoin="round"/>
</svg>
